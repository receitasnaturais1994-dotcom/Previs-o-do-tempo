    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #0b192c, #1e3e62); color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { width: 100%; max-width: 600px; background: rgba(11, 25, 44, 0.6); backdrop-filter: blur(15px); border-radius: 24px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); margin-top: 20px; text-align: center; }
        .header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 14px; }
        .header-nav a { color: #74c0fc; text-decoration: none; font-weight: 600; }
        .header-nav a:hover { text-decoration: underline; }
        h1 { font-size: 24px; font-weight: 600; margin-bottom: 5px; }
        .location-sub { font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 25px; }
        .rate-display { font-size: 48px; font-weight: 300; margin: 15px 0; color: #51cf66; }
        .condition { font-size: 18px; font-weight: 500; margin-bottom: 20px; color: rgba(255,255,255,0.9); }
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; text-align: left; }
        .detail-card { background: rgba(255,255,255,0.08); padding: 15px; border-radius: 14px; font-size: 14px; }
        .detail-card span { display: block; color: rgba(255,255,255,0.6); font-size: 12px; margin-bottom: 4px; }

        .cta-box p { font-size: 14px; margin-bottom: 12px; color: rgba(255,255,255,0.9); }
        .btn-home { display: inline-block; background: #4dabf7; color: #0b192c; padding: 10px 20px; border-radius: 12px; font-weight: bold; text-decoration: none; font-size: 14px; transition: background 0.2s; }
        .btn-home:hover { background: #74c0fc; }
        footer { margin-top: 40px; font-size: 11px; color: rgba(255,255,255,0.5); text-align: center; line-height: 1.5; max-width: 600px; }

</head>
<body>
    <div class="container">
        <div class="header-nav">
            <a href="../../index.html">← Global Metis ホームへ戻る</a>
            <span>🇧🇷 ブラジル・サンパウロ</span>
        </div>
        <h1>サンパウロ外国為替市場</h1>
        <div class="location-sub">📍 パウリスタ通り・ファリアリマ（BRL リアルタイムレート）</div>
        <div id="exchange-box"><p style="color: rgba(255,255,255,0.7); padding: 20px;">最新為替レートを取得中...</p></div>
        <div class="cta-box">
            <p>世界の天気予報、金融ハブ、マルチアセット情報もあわせてチェックできます。</p>
            <a href="../../index.html" class="btn-home">Global Metis ポータルを開く 🚀</a>
        </div>
    </div>
    <footer><p>&copy; 2026 Global Metis. 為替データはオープン為替レートAPIを通じて提供されています。</p></footer>
    <script>
        async function fetchRates() {
            const box = document.getElementById('exchange-box');
            try {
                const res = await fetch('https://open.er-api.com/v6/latest/BRL');
                if (!res.ok) throw new Error('レート取得に失敗しました');
                const data = await res.json();
                box.innerHTML = `
                    <div class="rate-display">基準: 1.00 BRL</div>
                    <div class="condition">インターバンク・リアルタイム為替レート</div>
                    <div class="details-grid">
                        <div class="detail-card"><span>米ドル（USD）</span><strong>$${data.rates.USD.toFixed(4)}</strong></div>
                        <div class="detail-card"><span>ユーロ（EUR）</span><strong>€${data.rates.EUR.toFixed(4)}</strong></div>
                        <div class="detail-card"><span>英ポンド（GBP）</span><strong>£${data.rates.GBP.toFixed(4)}</strong></div>
                        <div class="detail-card"><span>日本円（JPY）</span><strong>¥${data.rates.JPY.toFixed(2)}</strong></div>
                    </div>`;
            } catch (e) {
                box.innerHTML = `<p style="color: #ff6b6b;">現在、為替データを読み込めません。しばらくしてから再度お試しください。</p>`;
            }
        }
        fetchRates();
    </script>
</body>
</html>
